<!-- @dsCard group="Colors" viewport="700x150" name="Accent & status" subtitle="One quiet lilac for focus and the value being touched. Red only for recording." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-app);color:var(--text-1);font:var(--type-body)}
.l{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-3)}
.m{font:var(--type-value);color:var(--text-2)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"><div style="display:flex;flex-direction:column;gap:0;min-width:0"><div style="height:56px;border-radius:6px;background:var(--accent);box-shadow:inset 0 0 0 1px var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans);margin-top:6px">Accent</div><div class="m" style="font-size:11px;color:var(--text-3)">--accent<br>#c9bcf5</div></div><div style="display:flex;flex-direction:column;gap:0;min-width:0"><div style="height:56px;border-radius:6px;background:var(--accent-strong);box-shadow:inset 0 0 0 1px var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans);margin-top:6px">Accent strong</div><div class="m" style="font-size:11px;color:var(--text-3)">--accent-strong<br>#ddd4fb</div></div><div style="display:flex;flex-direction:column;gap:0;min-width:0"><div style="height:56px;border-radius:6px;background:var(--accent-dim);box-shadow:inset 0 0 0 1px var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans);margin-top:6px">Accent wash</div><div class="m" style="font-size:11px;color:var(--text-3)">--accent-dim<br>16%</div></div><div style="display:flex;flex-direction:column;gap:0;min-width:0"><div style="height:56px;border-radius:6px;background:var(--accent-ring);box-shadow:inset 0 0 0 1px var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans);margin-top:6px">Focus ring</div><div class="m" style="font-size:11px;color:var(--text-3)">--accent-ring<br>55%</div></div><div style="display:flex;flex-direction:column;gap:0;min-width:0"><div style="height:56px;border-radius:6px;background:var(--rec);box-shadow:inset 0 0 0 1px var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans);margin-top:6px">Record</div><div class="m" style="font-size:11px;color:var(--text-3)">--rec<br>#ef7a74</div></div><div style="display:flex;flex-direction:column;gap:0;min-width:0"><div style="height:56px;border-radius:6px;background:var(--live);box-shadow:inset 0 0 0 1px var(--line)"></div><div style="font:500 12px/1.2 var(--font-sans);margin-top:6px">Live</div><div class="m" style="font-size:11px;color:var(--text-3)">--live<br>#8fd9bd</div></div></div></body></html>
