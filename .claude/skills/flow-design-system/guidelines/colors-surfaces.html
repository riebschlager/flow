<!-- @dsCard group="Colors" viewport="700x170" name="Surface stack" subtitle="App → panel → raised → well. Separation by value, plus 6% hairlines." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-app);color:var(--text-1);font:var(--type-body)}
.l{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-3)}
.m{font:var(--type-value);color:var(--text-2)}</style></head><body><div style="background:var(--bg-app);padding:16px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)"><span class="l">bg-app</span>
<div style="margin-top:10px;background:var(--bg-panel);padding:16px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);display:flex;gap:16px;align-items:center"><span class="l">bg-panel</span>
<div style="background:var(--bg-raised);padding:12px 16px;border-radius:10px;box-shadow:var(--hl-top),0 0 0 1px var(--line)"><span class="l">bg-raised</span></div>
<div style="background:var(--bg-well);padding:12px 16px;border-radius:6px;border:1px solid var(--line)"><span class="l">bg-well</span></div>
<div style="background:var(--bg-hover);padding:12px 16px;border-radius:6px"><span class="l">bg-hover</span></div></div></div></body></html>
