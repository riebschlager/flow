<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-app);color:var(--text-1);font:var(--type-body)}

.m{font:var(--type-value);color:var(--text-2)}</style></head><body><div style="display:flex;gap:24px"><div style="display:flex;flex-direction:column;gap:8px"><div style="width:88px;height:56px;background:var(--bg-raised);border-radius:var(--r-1);box-shadow:inset 0 0 0 1px var(--line-strong)"></div><span class="m" style="font-size:11px">4 · steps</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:88px;height:56px;background:var(--bg-raised);border-radius:var(--r-2);box-shadow:inset 0 0 0 1px var(--line-strong)"></div><span class="m" style="font-size:11px">6 · inputs, buttons</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:88px;height:56px;background:var(--bg-raised);border-radius:var(--r-3);box-shadow:inset 0 0 0 1px var(--line-strong)"></div><span class="m" style="font-size:11px">10 · cards, popovers</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:88px;height:56px;background:var(--bg-raised);border-radius:var(--r-4);box-shadow:inset 0 0 0 1px var(--line-strong)"></div><span class="m" style="font-size:11px">16 · dialogs</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:88px;height:56px;background:var(--bg-raised);border-radius:var(--r-full);box-shadow:inset 0 0 0 1px var(--line-strong)"></div><span class="m" style="font-size:11px">pill · switch</span></div></div></body></html>
