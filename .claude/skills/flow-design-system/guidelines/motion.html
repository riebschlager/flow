<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="Hover to see easing. Fast for feedback, slow for the scene." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-app);color:var(--text-1);font:var(--type-body)}
.l{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-3)}
.m{font:var(--type-value);color:var(--text-2)}body:hover .row i{left:calc(100% - 12px)!important}</style></head><body><div style="display:flex;flex-direction:column;gap:14px"><div class="row" style="display:grid;grid-template-columns:220px 1fr;align-items:center;gap:16px"><span class="m" style="font-size:11px">180ms ease-out · state</span><div style="height:2px;background:var(--n-300);position:relative"><i style="position:absolute;top:-5px;left:0;width:12px;height:12px;border-radius:50%;background:var(--n-900);transition:left var(--dur-2) var(--ease-out)"></i></div></div><div class="row" style="display:grid;grid-template-columns:220px 1fr;align-items:center;gap:16px"><span class="m" style="font-size:11px">180ms settle · thumbs, knob return</span><div style="height:2px;background:var(--n-300);position:relative"><i style="position:absolute;top:-5px;left:0;width:12px;height:12px;border-radius:50%;background:var(--n-900);transition:left var(--dur-2) var(--ease-settle)"></i></div></div><div class="row" style="display:grid;grid-template-columns:220px 1fr;align-items:center;gap:16px"><span class="m" style="font-size:11px">320ms ease-out · folds, tabs</span><div style="height:2px;background:var(--n-300);position:relative"><i style="position:absolute;top:-5px;left:0;width:12px;height:12px;border-radius:50%;background:var(--n-900);transition:left var(--dur-3) var(--ease-out)"></i></div></div><div class="row" style="display:grid;grid-template-columns:220px 1fr;align-items:center;gap:16px"><span class="m" style="font-size:11px">700ms in-out · scene fades</span><div style="height:2px;background:var(--n-300);position:relative"><i style="position:absolute;top:-5px;left:0;width:12px;height:12px;border-radius:50%;background:var(--n-900);transition:left var(--dur-4) var(--ease-in-out)"></i></div></div></div></body></html>
